# Get a secret onto a machine without anyone typing it there.
#
# The alternative was measured, on a phone, over an evening: a 130-character URL
# pasted into a terminal arrives truncated, wrapped, or with a quote riding along,
# and every variant answers 401 exactly like a bad key. A browser form field does
# none of that. So the secret goes into the repository's settings once, this job
# encrypts it to every machine's own public key (deploy/keys/*.pub, published by
# the installer), commits the ciphertext, and the installer on the machine
# decrypts it with the private key that never left that machine - then applies
# it through the same probe gate deploy/set-rpc.sh uses, so a value that cannot
# do the job is never written.
#
# Run it by hand after adding or changing a secret. It also runs when a new
# machine publishes its key.
name: deliver-secrets

on:
  workflow_dispatch:
  push:
    paths: ['deploy/keys/*.pub']

permissions:
  contents: write

concurrency:
  group: deliver-secrets
  cancel-in-progress: false

jobs:
  deliver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install age
        run: sudo apt-get update -qq && sudo apt-get install -y -qq age

      # Every value here is a repository secret; an unset one is an empty
      # string and encrypt-secrets.sh skips it.
      - name: Encrypt each secret to every machine key
        env:
          RHC_RPC_URLS: ${{ secrets.RHC_RPC_URLS }}
          EXDATE_ALERT_WEBHOOK_URL: ${{ secrets.EXDATE_ALERT_WEBHOOK_URL }}
          EXDATE_TELEGRAM_BOT_TOKEN: ${{ secrets.EXDATE_TELEGRAM_BOT_TOKEN }}
          EXDATE_TELEGRAM_CHAT_ID: ${{ secrets.EXDATE_TELEGRAM_CHAT_ID }}
        run: bash deploy/encrypt-secrets.sh

      - name: Commit the ciphertext
        run: |
          git add deploy/secrets
          if git diff --cached --quiet; then echo "nothing to deliver"; exit 0; fi
          git config user.name 'exdate-secrets'
          git config user.email 'noreply@users.noreply.github.com'
          git commit -m "Deliver secrets, encrypted to $(ls deploy/keys/*.pub | xargs -n1 basename | sed 's/.pub$//' | paste -sd, -)"
          for attempt in 1 2 3 4; do
            git push && exit 0
            echo "push failed; rebasing and retrying ($attempt)"
            sleep $((attempt * 3))
            git pull --rebase origin "${GITHUB_REF_NAME}" || exit 1
          done
          exit 1
