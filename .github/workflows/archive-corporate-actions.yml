# Keep the corporate-action archive alive.
#
# GET /rhj/corporate-actions is a window about a month deep, with no pagination
# and no date filter: a row that falls out of it is unrecoverable from every
# first-party source. That is how the five July actions were lost. Running this
# daily is what makes "the archive is ours to keep" true rather than aspirational
# - it needs no deployment and no database, only this repository.
name: archive-corporate-actions

on:
  schedule:
    # 06:20 UTC daily. Off the hour on purpose: scheduled runs cluster there.
    - cron: '20 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: archive-corporate-actions
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The script refuses to write an empty or non-JSON window, so a bad read
      # leaves the archive untouched rather than pruning it.
      - name: Merge today's window into the archive
        # Optional. With the repository secret unset this is an empty string and
        # scripts/phase0/rpc.mjs falls back to its built-in order, so nothing
        # breaks; with it set, the collectors read the chain through an endpoint
        # exdate pays for rather than through Robinhood's, which is what
        # docs/terms-review.md asks for. Every collector together is ~1.5 M
        # compute units a month, measured.
        env:
          RHC_RPC_URLS: ${{ secrets.RHC_RPC_URLS }}
        run: node scripts/archive-corporate-actions.mjs

      # The registry moves when the issuer applies a multiplier, and nothing refreshed
      # it: the 2026-09-05 audit found it three days behind UPS and F (F12). Free to
      # run daily because the snapshot is left untouched when the content is unchanged,
      # so this commits only when the issuer actually changed something.
      - name: Refresh the issuer registry
        run: node scripts/phase0/snapshot-registry.mjs

      # Everything downstream of the archive, in dependency order and in one place:
      # the reconciliations (which read the archive directly since the 2026-09-05
      # audit), the typed registry CI checks against its sources, and the token
      # list, which carries what each token represents in shares and what it is
      # owed. Rebuilding them separately, on separate schedules, is what let four
      # surfaces disagree about the same pairing (F03).
      - name: Rebuild everything derived from the record
        env:
          RHC_RPC_URLS: ${{ secrets.RHC_RPC_URLS }}
        run: node scripts/rebuild-record.mjs

      - name: Check the record against its expectations
        run: node scripts/check-data-expectations.mjs

      - name: Commit only if something actually changed
        run: |
          paths="data/corporate-actions.archive.json data/robinhood-assets.snapshot.json data/reconciliations.observed.json packages/core/src/generated/registry.ts data/exdate.tokenlist.json"
          if git diff --quiet -- $paths; then
            echo "nothing changed"
            exit 0
          fi
          summary=$(node -e "const a=require('./data/corporate-actions.archive.json');process.stdout.write(a.archivedRows+' rows, '+a.beyondWindow+' beyond the window')")
          git config user.name 'exdate-archive'
          git config user.email 'noreply@users.noreply.github.com'
          git add $paths
          git commit -m "Archive corporate actions: $summary"

          for attempt in 1 2 3 4; do
            git push && exit 0
            echo "push failed; rebasing and retrying ($attempt)"
            sleep $((attempt * 3))
            git pull --rebase origin "${GITHUB_REF_NAME}" || exit 1
          done
          exit 1
