# Keep the corporate-action archive alive.
#
# GET /rhj/corporate-actions is a window about a month deep, with no pagination
# and no date filter: a row that falls out of it is unrecoverable from every
# first-party source. That is how the five July actions were lost. Running this
# daily is what makes "the archive is ours to keep" true rather than aspirational
# - it needs no deployment and no database, only this repository.
name: archive-corporate-actions

on:
  schedule:
    # 06:20 UTC daily. Off the hour on purpose: scheduled runs cluster there.
    - cron: '20 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: archive-corporate-actions
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The script refuses to write an empty or non-JSON window, so a bad read
      # leaves the archive untouched rather than pruning it.
      - name: Merge today's window into the archive
        # Optional. With the repository secret unset this is an empty string and
        # scripts/phase0/rpc.mjs falls back to its built-in order, so nothing
        # breaks; with it set, the collectors read the chain through an endpoint
        # exdate pays for rather than through Robinhood's, which is what
        # docs/terms-review.md asks for. Every collector together is ~1.5 M
        # compute units a month, measured.
        env:
          RHC_RPC_URLS: ${{ secrets.RHC_RPC_URLS }}
        run: node scripts/archive-corporate-actions.mjs

      # The typed module the poller seeds from is generated, and CI checks it
      # against its sources - so an archive commit that skipped this would make
      # the very next CI run fail on drift.
      - name: Regenerate the typed registry
        run: node scripts/generate-registry.mjs

      # The list carries what each token represents in shares and what it is owed, both of
      # which move with the archive, so it is rebuilt here rather than on its own schedule.
      # It refuses to write an invalid list: a consumer would silently ignore one.
      - name: Rebuild the token list
        run: node --experimental-strip-types --no-warnings scripts/build-token-list.mjs

      - name: Commit only if something actually changed
        run: |
          if git diff --quiet -- data/corporate-actions.archive.json packages/core/src/generated/registry.ts data/exdate.tokenlist.json; then
            echo "nothing changed"
            exit 0
          fi
          summary=$(node -e "const a=require('./data/corporate-actions.archive.json');process.stdout.write(a.archivedRows+' rows, '+a.beyondWindow+' beyond the window')")
          git config user.name 'exdate-archive'
          git config user.email 'noreply@users.noreply.github.com'
          git add data/corporate-actions.archive.json packages/core/src/generated/registry.ts data/exdate.tokenlist.json
          git commit -m "Archive corporate actions: $summary"
          git push
