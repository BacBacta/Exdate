# Standing expectations over data/ (see docs/data-audit-2026-09-05.md, section 6.8).
#
# Runs on every commit that touches the record - the collectors' as well as a person's -
# and on demand. It installs the workspace for viem's EIP-55 checksum, which the script
# reports as skipped rather than passed when the module is missing, and it builds the
# public site so the checks that compare a published figure against its dataset field
# have something to read.
#
# That build is the point. Those assertions are guarded by
# existsSync('apps/web/out/index.html') and skip when the site has not been built, so
# until this job built it they only ever ran on a developer's machine and protected
# nothing in CI: the site could have rendered a figure that disagreed with data/ and
# every run would still have been green. Found by reading a status check's own skip
# count - "0 failed, 1 warnings, 2 skipped".
name: data-expectations

on:
  push:
    branches: [claude/lance-en5q6j]
    paths:
      - 'data/**'
      - 'scripts/check-data-expectations.mjs'
      - 'scripts/build-history.mjs'
      - 'scripts/build-methodology.mjs'
      - 'scripts/lib/market-session.mjs'
      - 'docs/methodology.md'
      # The methodology note is generated from these, so a constant moving here has to re-run the
      # check that compares the two. Everything this job runs must be able to trigger it: a filter
      # that omits a script the job runs means the job cannot fail on that script's own change -
      # found by pushing a fix to build-history.mjs and waiting for a run that never started.
      - 'packages/core/src/**'
      - '.github/workflows/data-expectations.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: data-expectations-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # The whole history, not the default depth of one: scripts/build-history.mjs derives the
      # point-in-time index from `git log`, and a shallow checkout rebuilds it as a truncated
      # version of itself. The script refuses outright on a shallow clone rather than reporting the
      # difference as drift, which is what the first run of it did.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The static export, so the site checks read the pages a visitor would get: the
      # home page's three figures against their dataset fields, and calendar.ics for
      # CRLF, 75-octet folding and unique UIDs.
      - name: Build the public site
        run: pnpm --filter @exdate/web build

      # The point-in-time index is derived from git, never appended to by hand, so the test that
      # matters is that it is still exactly what git yields - and that replaying it returns what
      # each file actually held, at every revision. An index that had drifted would answer "what
      # did you publish at time T" with something nobody ever published.
      # The methodology note is generated from the constants it describes. Editing a constant and
      # not the note - or the note and not the constant - turns this red. A document invited to be
      # cited cannot be the fifth thing this project found drifting from its own code.
      - name: Does the methodology note still match the code?
        run: node --experimental-strip-types --no-warnings scripts/build-methodology.mjs --check

      - name: Is the history index still what git says?
        run: node scripts/build-history.mjs --check

      - name: Check the record against its expectations
        run: node scripts/check-data-expectations.mjs

      # A skip is not a pass. Every check this job can run must actually run, so a
      # future guard that silently stops one - a renamed output directory, a moved
      # file - fails here instead of going quiet.
      - name: No check may be skipped in CI
        run: |
          if node scripts/check-data-expectations.mjs | grep '^skip '; then
            echo "::error::a check was skipped; in CI every check must run"
            exit 1
          fi
