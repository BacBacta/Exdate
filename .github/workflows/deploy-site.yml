# Keep the published site level with the committed record.
#
# Seven collectors now write to this repository on their own schedules, and the site is
# a static build: without this, every one of those commits makes the published pages
# staler, and the figures a reader sees drift away from the figures in git. That is the
# one failure this project cannot tolerate, because "every number traces to a committed
# observation" stops being true the moment the two disagree.
#
# Deployment goes through scripts/deploy-web.sh, which uploads the tree without .git:
# Vercel refuses a CLI deployment whose commit author is not a team member, and the
# commits here are made by the collectors. See the 2026-09-03 entry in CLAUDE.md.
#
# Needs a durable VERCEL_TOKEN in the repository secrets (vercel.com/account/tokens);
# the device-flow token used interactively expires in eight hours. Without it this
# workflow does nothing and says so, rather than failing every hour.
name: deploy-site

on:
  push:
    branches: [claude/lance-en5q6j]
    # Only what the site actually renders. A change to a script or a test does not
    # move a published figure, and a deploy per commit would be noise.
    paths:
      - 'data/**'
      - 'apps/web/**'
      - 'packages/core/**'
      - 'vercel.json'
  schedule:
    # A safety net: catches anything the path filter missed and any deploy that failed.
    - cron: '40 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-site
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The `secrets` context is not available in a step's `if`, so the token is lifted
    # into the environment here and the steps test that instead. Written the other way
    # the guard evaluates to nothing and every step runs regardless.
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4

      - name: Say plainly when nothing is configured
        if: env.VERCEL_TOKEN == '' || env.VERCEL_PROJECT_ID == ''
        run: |
          echo "The site will stay at whatever was last deployed by hand."
          echo "Needs the secret VERCEL_TOKEN (vercel.com/account/tokens) and the repository"
          echo "variables VERCEL_ORG_ID and VERCEL_PROJECT_ID. See TODO.md for both values."
          exit 0

      - name: Install
        if: env.VERCEL_TOKEN != '' && env.VERCEL_PROJECT_ID != ''
        run: pnpm install --frozen-lockfile

      - name: Deploy
        if: env.VERCEL_TOKEN != '' && env.VERCEL_PROJECT_ID != ''
        run: |
          # .vercel/project.json is gitignored, so rebuild it from the two ids.
          mkdir -p .vercel
          printf '{"projectId":"%s","orgId":"%s"}\n' "$VERCEL_PROJECT_ID" "$VERCEL_ORG_ID" > .vercel/project.json
          npm i -g vercel@59
          scripts/deploy-web.sh
