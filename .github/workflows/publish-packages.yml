# Publish @exdate/core and @exdate/sdk to npm, from here rather than from anyone's laptop.
#
# The token stays a repository secret and never reaches a terminal - the same
# reason the RPC key goes through deliver-secrets.yml rather than being typed on
# a machine. A publish is irreversible (npm forbids republishing a version, and
# unpublish is limited to 72 hours), so this never runs on a push: it is
# dispatched by hand and DRY RUN BY DEFAULT.
#
# NPM_TOKEN must be a GRANULAR access token - npm removed classic and Automation
# tokens in November 2025 - with "Read and write" under "Packages and scopes",
# covering @exdate, and Bypass 2FA on.
#
# The "Organizations" section of the same form is NOT that. npm's own words:
# granting a token access to an organization "does not give the token the right
# to publish packages managed by the organization". It manages settings, teams
# and users. A token with only that reads the scope perfectly and 403s on PUT.
# Both packages now exist, so the token can be replaced with trusted publishing
# (OIDC, no token, nothing to renew), configured per package on npmjs.com.
#
#   Actions -> publish-packages -> Run workflow
#     confirm: (empty)   packs, checks the credential, prints what would go
#     confirm: PUBLISH   publishes
#
# A typed word rather than a checkbox, because the checkbox failed quietly: a
# boolean input compared against `false` in an `if:` is skipped when the value
# arrives as a string, and the run still reports success. The last step asks the
# registry what it actually holds rather than trusting that a step was reached.
#
# Order matters: @exdate/sdk depends on @exdate/core, and pnpm rewrites
# `workspace:*` to the exact version at pack time, so core must exist on the
# registry first or the sdk installs broken.
name: publish-packages

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type PUBLISH to publish for real. Anything else, including empty, is a dry run.'
        type: string
        default: ''

permissions:
  contents: read
  id-token: write   # npm provenance: ties each tarball to this workflow run

concurrency:
  group: publish-packages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm

      # Trusted publishing (OIDC) needs a newer npm than Node 22 ships with.
      # npm's words: "Trusted publishing requires npm CLI version 11.5.1 or
      # later and Node version 22.14.0 or higher." Installed and then CHECKED,
      # because a silently old npm would fall back to needing a token and the
      # failure would read as a permissions problem again.
      - name: Use an npm that can do trusted publishing
        run: |
          npm install -g npm@latest
          echo "node $(node --version)  npm $(npm --version)"
          node -e '
            const need = [11, 5, 1]
            const got = process.argv[1].split(".").map(Number)
            const ok = got[0] > need[0] || (got[0] === need[0] &&
              (got[1] > need[1] || (got[1] === need[1] && got[2] >= need[2])))
            if (!ok) { console.error(`npm ${process.argv[1]} is older than 11.5.1; trusted publishing will not work`); process.exit(1) }
          ' "$(npm --version)"

      - run: pnpm install --frozen-lockfile

      # A broken package is worse than an unpublished one, and a version cannot
      # be taken back. Everything the repository knows how to check runs first.
      - name: Typecheck and test
        run: |
          pnpm typecheck
          pnpm test

      - name: Build both packages
        run: |
          pnpm --filter @exdate/core build
          pnpm --filter @exdate/sdk build

      # What would actually leave: the file list and the rewritten manifest.
      # A tarball carrying uncompiled sources, or an sdk still asking for
      # `workspace:*`, fails the job here rather than reaching the registry.
      - name: Show and check each tarball
        run: |
          mkdir -p /tmp/pack
          # pnpm pack, not npm pack: it is what rewrites `workspace:*` in the
          # sdk's manifest to the exact version. These tarballs are the ones
          # published below - the artifact inspected here is the artifact that
          # leaves, rather than a second pack nobody looked at.
          for p in core sdk; do
            ( cd "packages/$p" && pnpm pack --pack-destination /tmp/pack )
          done
          for t in /tmp/pack/*.tgz; do
            echo "=== $t ($(du -h "$t" | cut -f1)) ==="
            tar tzf "$t" | sed 's|^package/||' | sort
            tar xzOf "$t" package/package.json | node -e '
              let d = ""
              process.stdin.on("data", (c) => (d += c)).on("end", () => {
                const j = JSON.parse(d)
                console.log(`--- ${j.name}@${j.version} main=${j.main} types=${j.types}`)
                console.log(`--- dependencies ${JSON.stringify(j.dependencies ?? {})}`)
                const bad = Object.entries(j.dependencies ?? {}).filter(([, v]) => String(v).startsWith("workspace:"))
                if (bad.length) { console.error(`workspace: protocol left in ${j.name}: ${JSON.stringify(bad)}`); process.exit(1) }
              })'
            if tar tzf "$t" | grep -q '^package/src/'; then
              echo "uncompiled sources in $t"; exit 1
            fi
          done

      # A dry run that never talks to the registry cannot tell you the two things
      # that actually fail a first publish: a token that is not accepted, and a
      # scope this account may not write to. Both are asked here, in BOTH modes.
      #
      # The previous version of this step ran `npm access list packages @exdate`
      # and reported "the scope is visible to this token" when it succeeded. That
      # command exits 0 with NO credential at all (measured: empty HOME, no
      # token, exit 0, no output), so it said yes to everything and said it right
      # before a 403. A check whose success does not depend on the thing being
      # checked is worse than no check - it is the same mistake as probing
      # `.git/objects` for writability when git writes into its fan-out
      # subdirectories. What follows asks endpoints that require the credential
      # and prints what they answer.
      - name: Check the credential and the scope
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          TOK: ${{ secrets.NPM_TOKEN }}   # matched against npm's printed prefix; never echoed
        run: |
          # No token is not an error once trusted publishing is configured on
          # each package: npm exchanges this job's OIDC token for a short-lived
          # credential, and generates provenance itself. So an empty secret
          # means that path, and the publish below proves whether it is - the
          # final step asks the registry rather than trusting either branch.
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "No NPM_TOKEN. Publishing will use trusted publishing (OIDC), which requires"
            echo "a Trusted Publisher configured on BOTH @exdate/core and @exdate/sdk at"
            echo "npmjs.com, naming repository BacBacta/Exdate and workflow publish-packages.yml."
            echo "If it is not configured, the publish below fails with an authentication error"
            echo "rather than a permissions one."
            # setup-node writes `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}`
            # into the job's .npmrc. With no secret that expands to an empty
            # bearer, which npm would send instead of falling through to OIDC.
            # Remove the line rather than leave an empty credential in place.
            if [ -n "${NPM_CONFIG_USERCONFIG:-}" ] && [ -f "$NPM_CONFIG_USERCONFIG" ]; then
              sed -i '/_authToken/d' "$NPM_CONFIG_USERCONFIG"
              echo "removed the empty auth line from $NPM_CONFIG_USERCONFIG"
            fi
            exit 0
          fi
          npm config set //registry.npmjs.org/:_authToken "$NODE_AUTH_TOKEN"

          who=$(npm whoami --registry=https://registry.npmjs.org 2>&1) || {
            echo "npm rejected the token entirely: $who"
            echo "It must be a GRANULAR access token - npm removed classic and Automation tokens in November 2025."
            exit 1
          }
          echo "npm accepts the token as: $who"

          # Authenticated introspection. Every call prints its status code as
          # well as its body, because a body alone cannot be told apart from a
          # refusal: /-/npm/v1/user and /-/npm/v1/tokens both answer 401 with no
          # credential (measured), and /-/org/<scope>/user answers 200 {} - so a
          # silent empty body was being read as "nothing to report" when it may
          # have been "not allowed to ask".
          api() {
            local body code
            body="$(curl -sS --max-time 30 -w '\n%{http_code}' \
              -H "authorization: Bearer $NODE_AUTH_TOKEN" \
              "https://registry.npmjs.org$1")"
            code="$(printf '%s' "$body" | tail -1)"
            API_BODY="$(printf '%s' "$body" | sed '$d')"
            echo "GET $1 -> HTTP $code"
            printf '  %s\n' "$(printf '%s' "$API_BODY" | head -c 600)"
          }

          # The token's own permissions, straight from npm. This is the field
          # that decides a 403 on PUT and it has been guessed at twice; a
          # granular token appears here with its access level and the packages
          # or scopes it was granted. Only metadata is returned - npm truncates
          # the secret itself, and Actions masks it regardless.
          echo "--- what npm says this token is allowed to do"
          api /-/npm/v1/tokens
          # Read the verdict out of that answer rather than leaving a human to
          # spot `"action":"read"` in a wall of JSON. npm returns a granular
          # token as its permissions (package/org x read/write) and the scopes
          # it was granted; the token in use is matched by the prefix and suffix
          # npm prints, so a list holding several tokens still names the right
          # one. Neither half of the secret is echoed - only whether it matched.
          TOKENS_JSON="$API_BODY" node -e '
            const list = (JSON.parse(process.env.TOKENS_JSON || "{}").objects) || []
            const t = process.env.TOK || ""
            const mine = list.find((o) => {
              const [a, b] = String(o.token || "").split("...")
              return a && b && t.startsWith(a) && t.endsWith(b)
            }) || (list.length === 1 ? list[0] : null)
            if (!mine) {
              console.log("could not identify this token among the " + list.length + " npm listed")
              process.exit(0)
            }
            const perm = (n) => (mine.permissions || []).find((p) => p.name === n)?.action ?? "none"
            const scopes = (mine.scopes || []).map((s) => `${s.type}:${s.name ?? "*"}`).join(", ")
            console.log(`token "${mine.name}": package=${perm("package")} org=${perm("org")}` +
              ` scopes=[${scopes}] bypass_2fa=${mine.bypass_2fa} cidr=${(mine.cidr || []).length}` +
              ` expires ${mine.expiry ?? "never"}`)
            if (perm("package") !== "write") {
              console.log("")
              console.log("This token CANNOT publish. npm reports package=" + perm("package") + ".")
              console.log("On npmjs.com, Access Tokens -> this token -> Packages and scopes:")
              console.log("  set Permissions to \"Read and write\", covering @exdate")
              console.log("  (All packages, or the exdate SCOPE - selecting named packages cannot")
              console.log("   work, since the scope holds none yet).")
              console.log("The Organizations section is a different grant: npm states it \"does not")
              console.log("give the token the right to publish packages managed by the organization\".")
              process.exit(3)
            }
            console.log("This token may publish (package=write).")
          ' || {
            status=$?
            [ "$status" -eq 3 ] && exit 1
            echo "could not read the token permissions (node exit $status); carrying on"
          }

          echo "--- the account behind it, including its 2FA state"
          api /-/npm/v1/user

          # Unauthenticated this returns {} (checked against @babel and @vercel
          # as well); with a member's credential it names each member and role.
          echo "--- members of the exdate scope, as this token sees them"
          api /-/org/exdate/user
          roster="$API_BODY"

          role="$(printf '%s' "$roster" | node -e '
            let d = ""
            process.stdin.on("data", (c) => (d += c)).on("end", () => {
              let j = {}
              try { j = JSON.parse(d) } catch { return }
              process.stdout.write(String(j[process.argv[1]] ?? ""))
            })' "$who")"

          if [ -n "$role" ]; then
            echo "$who is a member of the exdate scope with the role: $role"
            case "$role" in
              owner|admin|developer) echo "That role may publish, so a 403 on PUT is not the account." ;;
              *) echo "That role may NOT publish to the scope." ;;
            esac
          else
            echo "This token does not see $who as a member of the exdate scope."
            echo "  The scope resolves on npm - a made-up one answers 404 \"Scope not found\" -"
            echo "  so it belongs to somebody. If not to this account, no token will publish"
            echo "  there and the package needs a different scope."
          fi

          echo "--- what the scope already holds"
          api /-/org/exdate/package

      # Is trusted publishing configured? npm answers that nowhere: "npm does
      # not verify your trusted publisher configuration when you save it", and
      # "errors will only appear when you attempt to publish". There is no read
      # endpoint - four candidate paths were tried and all 404.
      #
      # So this rehearses the OIDC path with the token deliberately removed and
      # --dry-run on, and reports what npm says. The docs do not state whether a
      # dry run performs the token exchange, so this measures it rather than
      # assuming: if npm exchanges first, a missing Trusted Publisher shows up
      # here for free and a configured one is confirmed without spending a
      # version number. If npm never contacts the registry, the output says so
      # and we have learnt that a dry run cannot answer the question.
      #
      # It never fails the job. It is an experiment, not a gate.
      - name: Rehearse the trusted-publishing path (publishes nothing)
        if: ${{ inputs.confirm != 'PUBLISH' }}
        run: |
          if [ -n "${NPM_CONFIG_USERCONFIG:-}" ] && [ -f "$NPM_CONFIG_USERCONFIG" ]; then
            sed -i '/_authToken/d' "$NPM_CONFIG_USERCONFIG"
          fi
          npm config delete //registry.npmjs.org/:_authToken 2>/dev/null || true
          echo "auth lines left in the job's npmrc: $(grep -c authToken "${NPM_CONFIG_USERCONFIG:-/dev/null}" 2>/dev/null || echo 0)"
          echo

          for t in /tmp/pack/exdate-core-*.tgz /tmp/pack/exdate-sdk-*.tgz; do
            echo "=== npm publish --dry-run $(basename "$t") , no token, OIDC only"
            set +e
            out="$(npm publish "$t" --access public --dry-run 2>&1)"
            status=$?
            set -e
            printf '%s\n' "$out" | tail -25
            echo "--- exit $status"
            if printf '%s' "$out" | grep -qiE 'oidc|trusted publish|id.token|exchange'; then
              echo "VERDICT: npm did reach for OIDC on a dry run - this rehearsal is meaningful."
            elif [ $status -eq 0 ]; then
              echo "VERDICT: the dry run succeeded WITHOUT mentioning OIDC, so it most likely"
              echo "  never authenticated at all. That means a dry run cannot tell you whether"
              echo "  the Trusted Publisher is configured; only a real publish can."
            else
              echo "VERDICT: npm refused. Read the message above - if it names authentication or"
              echo "  a trusted publisher, that IS the answer about the configuration."
            fi
            echo
          done

      - name: Publish
        # An exact string, not a boolean. A `type: boolean` input reaches an
        # expression as a boolean here and as the STRING "false" elsewhere, and
        # `'false' == false` is false in GitHub's expression language - so the
        # step would be skipped and the run would still report success. Twice in
        # a row the operator was told "publish done" while nothing had left, and
        # a condition whose failure mode is silence is the wrong condition for an
        # irreversible action. Typing PUBLISH is unambiguous in both directions.
        if: ${{ inputs.confirm == 'PUBLISH' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # A 403 "You may not perform that action with these credentials" here
          # would be the token and nothing else - the step above establishes the
          # account owns the scope, and reads the token's own permissions from
          # npm. Nothing is created by a refused PUT, so re-running is safe.
          #
          # npm publish, not pnpm publish, and this is measured rather than
          # assumed: `pnpm publish --help` on pnpm 10.18.0 does not mention
          # provenance at all, while `npm publish --help` does. pnpm ACCEPTS
          # --provenance and silently ignores it, which is how @exdate/core@0.1.0
          # and @exdate/sdk@0.1.0 went out with `"attestations": null` while this
          # job's command line said --provenance. A version is immutable, so
          # those two carry no provenance for good; every version after them
          # does. The final step reads the registry back, so the claim and the
          # fact are checked against each other rather than assumed to agree.
          #
          # The tarballs are the ones inspected above, published in order: the
          # sdk's manifest names an exact version of core, so core must exist on
          # the registry first or the sdk installs broken.
          set -x
          npm publish /tmp/pack/exdate-core-*.tgz --access public --provenance
          npm publish /tmp/pack/exdate-sdk-*.tgz  --access public --provenance

      # Ask the registry, rather than reporting on the strength of a step having
      # been reached. A publish that was skipped, or one that npm accepted and
      # did not serve, both look like success from inside the job.
      - name: Say what the registry now holds
        run: |
          confirmed='${{ inputs.confirm }}'
          published=0
          for pkg in @exdate/core @exdate/sdk; do
            enc="${pkg/\//%2f}"
            code=$(curl -s -o /tmp/reg.json -w '%{http_code}' --max-time 30 "https://registry.npmjs.org/$enc" || echo 000)
            if [ "$code" = "200" ]; then
              node -e '
                const d = require("/tmp/reg.json")
                const v = d["dist-tags"].latest, m = d.versions[v]
                console.log(`  on the registry: ${d._id}@${v} (${d.time[v]}), ${Math.round(m.dist.unpackedSize / 1024)} KB, provenance ${m.dist.attestations ? "yes" : "no"}`)'
              published=$((published+1))
            else
              echo "  not on the registry: $pkg (HTTP $code)"
            fi
          done

          if [ "$confirmed" = "PUBLISH" ]; then
            if [ "$published" -eq 2 ]; then
              echo "Both packages are live. A version cannot be republished; bump the version for the next release."
              echo "Now configure trusted publishing on each package at npmjs.com and delete NPM_TOKEN."
            else
              echo "The publish step ran but the registry does not hold both packages."
              exit 1
            fi
          else
            echo "DRY RUN - nothing was published, whatever the tarballs above show."
            echo "To publish for real: Run workflow again and type PUBLISH in the confirm box."
            [ "$published" -eq 0 ] || echo "(the packages listed above were published by an earlier run)"
          fi
