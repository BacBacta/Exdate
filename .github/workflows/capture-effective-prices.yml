# Be there when a multiplier changes.
#
# The reconciliation needs the underlying price at the instant a step takes effect.
# Chainlink can answer that after the fact, but only for 35 of 194 tokens and only
# from a round that can be hours old. The issuer quotes all 194 and refreshes every
# 15 s - and serves nothing but the present. That price exists for about fifteen
# seconds and is then gone for good, like the five July corporate actions that fell
# out of the issuer's one-month window.
#
# What makes catching it possible is exdate's own measurement: UIMultiplierUpdated
# fires about nine minutes BEFORE the change, carrying effectiveAt. A run scans for
# that announcement and comes back at the right second.
#
# Every five minutes on paper. Measured on its first morning, GitHub fired it every
# 7 to 25 minutes: the cron is best-effort, and against a nine-minute lead that
# caught about one step in four. The run now waits up to nine minutes for an
# effectiveAt it has seen announced, inside the job's timeout, and the concurrency
# group queues the next run behind a waiting one. That doubles the odds; it does
# not make them good. data/capture-cadence.observed.json measures the real gap.
#
# The answer is scripts/watch-effective-prices.mjs on a machine that is simply
# always there. Once it runs, set the repository variable EXDATE_CAPTURE_MODE to
# `watchdog`: this job then checks the watcher's heartbeat instead of capturing,
# captures in its place only while the heartbeat is stale, and says so through
# the alert sinks on each transition.
name: capture-effective-prices

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

# Runs must not overlap: they share one committed file. Queueing a late run behind
# a waiting one is right, since the waiting one is the one holding the deadline.
concurrency:
  group: capture-effective-prices
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    # Nine minutes of waiting, three samples, then a commit: twelve leaves room.
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Writes nothing when there is no announcement to act on, which is most runs.
      # In watchdog mode it also needs the sinks, to say when the watcher goes quiet.
      - name: Watch for an announcement and capture at effect
        env:
          EXDATE_CAPTURE_MODE: ${{ vars.EXDATE_CAPTURE_MODE }}
          EXDATE_CAPTURE_BUDGET_MS: ${{ vars.EXDATE_CAPTURE_BUDGET_MS }}
          EXDATE_ALERT_WEBHOOK_URL: ${{ secrets.EXDATE_ALERT_WEBHOOK_URL }}
          EXDATE_TELEGRAM_BOT_TOKEN: ${{ secrets.EXDATE_TELEGRAM_BOT_TOKEN }}
          EXDATE_TELEGRAM_CHAT_ID: ${{ secrets.EXDATE_TELEGRAM_CHAT_ID }}
        run: node scripts/capture-effective-prices.mjs

      # Sends the announcement while its nine-minute lead is still a lead, and the
      # applied notice at the instant no chain event marks. Does nothing when no sink
      # is configured; records delivery in the same file, so the commit below carries
      # the evidence that the lead was given and not merely claimed.
      - name: Notify
        env:
          EXDATE_ALERT_WEBHOOK_URL: ${{ secrets.EXDATE_ALERT_WEBHOOK_URL }}
          EXDATE_TELEGRAM_BOT_TOKEN: ${{ secrets.EXDATE_TELEGRAM_BOT_TOKEN }}
          EXDATE_TELEGRAM_CHAT_ID: ${{ secrets.EXDATE_TELEGRAM_CHAT_ID }}
          EXDATE_SITE_URL: ${{ vars.EXDATE_SITE_URL }}
        run: node scripts/notify.mjs

      - name: Commit only if something was actually captured
        run: |
          if git diff --quiet -- data/effective-prices.observed.json; then
            echo "nothing captured"
            exit 0
          fi
          summary=$(node -e "const d=require('./data/effective-prices.observed.json');const n=d.steps.filter(s=>s.announcedNotifiedAt).length;process.stdout.write(d.summary.steps+' steps, '+d.summary.withQuoteAtEffect+' priced at effect, '+n+' announced in time, '+d.summary.givenUp+' unrecoverable')")
          git config user.name 'exdate-capture'
          git config user.email 'noreply@users.noreply.github.com'
          git add data/effective-prices.observed.json
          git commit -m "Capture issuer quotes at effect: $summary"

          # Other scheduled jobs push to this branch too.
          for attempt in 1 2 3 4; do
            git push && exit 0
            echo "push failed; rebasing and retrying ($attempt)"
            sleep $((attempt * 3))
            git pull --rebase origin "${GITHUB_REF_NAME}" || exit 1
          done
          exit 1
