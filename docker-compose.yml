# One command for a hosted exdate: `docker compose up -d`.
#
# Postgres keeps the tables; the indexer polls the chain and serves the API on
# 42069, published on the loopback only. Nothing else is required: the public
# RPC is the default and every other setting has a default in .env.example.
#
# Two profiles, because two of these must never start by accident:
#
#   --profile public    adds Caddy and the status page, and serves both under
#                       real names with automatic TLS. Needs EXDATE_API_HOST and
#                       EXDATE_STATUS_HOST set to names that already resolve
#                       here, and 80 and 443 open inbound for the ACME challenge.
#   --profile watcher   adds the capture watcher. Off by default because the
#                       machine that runs it usually runs it under systemd
#                       (deploy/install.sh), and two watchers on one host would
#                       sample the same instants twice and race on one file.
#
# `deploy/install-api.sh` does all of this on a fresh Debian or Ubuntu box.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: exdate
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-exdate}
      POSTGRES_DB: exdate
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U exdate -d exdate"]
      interval: 5s
      timeout: 3s
      retries: 20

  indexer:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://exdate:${POSTGRES_PASSWORD:-exdate}@db:5432/exdate
      DATABASE_SCHEMA: exdate
      # Empty means the code's own order: a third-party endpoint first, Robinhood's
      # as the fallback (see .env.example and docs/terms-review.md).
      RHC_RPC_URLS: ${RHC_RPC_URLS:-}
      RHC_RPC_URL: ${RHC_RPC_URL:-}
      EXDATE_POLL_INTERVAL_BLOCKS: ${EXDATE_POLL_INTERVAL_BLOCKS:-600}
      # keys as key:label:requestsPerMinute, comma separated; empty = open at the anonymous rate
      EXDATE_API_KEYS: ${EXDATE_API_KEYS:-}
      EXDATE_ANON_RPM: ${EXDATE_ANON_RPM:-60}
      EXDATE_KEY_RPM: ${EXDATE_KEY_RPM:-600}
      # signed webhook receivers, a JSON array: [{"id":"curator","url":"https://…","secret":"…","events":["dividend.reconciled"]}]
      EXDATE_WEBHOOK_ENDPOINTS: ${EXDATE_WEBHOOK_ENDPOINTS:-}
      # Self-service subscriptions (POST /v1/webhooks/subscriptions) live in one
      # file the process owns, on a volume so they outlive a rebuild. Set
      # EXDATE_WEBHOOK_SELF_SERVICE=false to turn the routes off.
      EXDATE_WEBHOOK_SELF_SERVICE: ${EXDATE_WEBHOOK_SELF_SERVICE:-true}
      EXDATE_WEBHOOK_SUBSCRIPTIONS_FILE: /var/lib/exdate/webhook-subscriptions.json
      # Concluded deliveries, on the same volume and for the same reason the subscriptions are:
      # a code deploy drops the Ponder schema, and the delivery rows with it. Token states and
      # reconciliations come back - the poller recomputes them from the chain within one interval -
      # but a delivery happened once, at an instant, and nothing recreates it. Measured on
      # 2026-09-06: the morning's deploy took every delivery row, so the published latency would
      # have restarted from zero at every deploy for ever.
      EXDATE_LATENCY_JOURNAL_FILE: /var/lib/exdate/webhook-deliveries.jsonl
    volumes:
      - subscriptions:/var/lib/exdate
    # Loopback only: Caddy reaches it over the compose network, and an API
    # published on the public interface would answer unencrypted beside the
    # TLS one it is meant to be read through.
    ports:
      - "127.0.0.1:42069:42069"
    restart: unless-stopped

  # The capture watcher: a process that is always there when a multiplier
  # changes, which GitHub's best-effort cron is not (measured: every 7 to 25
  # minutes against a nine-minute lead). It commits and pushes from this clone,
  # so the clone is mounted as a working copy and the deploy key read-only.
  # Once it runs, set the repository variable EXDATE_CAPTURE_MODE=watchdog so
  # the GitHub job checks its heartbeat instead of capturing on its own.
  watcher:
    profiles: ["watcher"]
    build:
      context: .
      dockerfile: deploy/watcher.Dockerfile
    volumes:
      - .:/repo
      - ${EXDATE_WATCHER_SSH_DIR:-~/.ssh}:/root/.ssh:ro
    environment:
      # Empty means the code's own order: a third-party endpoint first, Robinhood's
      # as the fallback (see .env.example and docs/terms-review.md).
      RHC_RPC_URLS: ${RHC_RPC_URLS:-}
      RHC_RPC_URL: ${RHC_RPC_URL:-}
      EXDATE_WATCH_TICK_MS: ${EXDATE_WATCH_TICK_MS:-30000}
      EXDATE_WATCH_HEARTBEAT_MS: ${EXDATE_WATCH_HEARTBEAT_MS:-21600000}
      EXDATE_WATCH_PUSH: ${EXDATE_WATCH_PUSH:-true}
      EXDATE_ALERT_WEBHOOK_URL: ${EXDATE_ALERT_WEBHOOK_URL:-}
      EXDATE_TELEGRAM_BOT_TOKEN: ${EXDATE_TELEGRAM_BOT_TOKEN:-}
      EXDATE_TELEGRAM_CHAT_ID: ${EXDATE_TELEGRAM_CHAT_ID:-}
      EXDATE_SITE_URL: ${EXDATE_SITE_URL:-}
    restart: unless-stopped

  # exdate's own webhook subscriber - the first endpoint the outbox ever delivered to, and what
  # makes the published latency a measurement rather than a budget.
  #
  # `network_mode: service:indexer` puts it inside the indexer's network namespace, so the indexer
  # reaches it at http://127.0.0.1:8091 and nothing else can reach it at all: no port is published,
  # no name resolves to it, and no DNS record or certificate had to exist for it. That also lets it
  # satisfy the endpoint rule in @exdate/core unchanged - plain http is allowed for loopback and
  # refused everywhere else - because this genuinely is loopback rather than an exception carved
  # out for it. With no secret set the indexer subscribes nothing and this container refuses to
  # start, which is the honest pair of behaviours: no half-configured subscriber.
  receiver:
    profiles: ["public"]
    build:
      context: .
      dockerfile: deploy/receiver/Dockerfile
    network_mode: "service:indexer"
    depends_on:
      - indexer
    environment:
      EXDATE_RECEIVER_SECRET: ${EXDATE_RECEIVER_SECRET:-}
      EXDATE_RECEIVER_PORT: ${EXDATE_RECEIVER_PORT:-8091}
    restart: unless-stopped

  # The status page, rendered on the server so the browser never learns the
  # API's address and the API needs no cross-origin grant for it.
  status:
    profiles: ["public"]
    build:
      context: .
      dockerfile: deploy/status.Dockerfile
    depends_on:
      - indexer
    environment:
      EXDATE_API_URL: http://indexer:42069
    restart: unless-stopped

  # TLS and the public names. Caddy gets and renews the certificates itself;
  # the volumes keep them across restarts, and losing them means asking Let's
  # Encrypt again, which is rate-limited.
  caddy:
    profiles: ["public"]
    image: caddy:2-alpine
    depends_on:
      - indexer
      - status
    environment:
      EXDATE_API_HOST: ${EXDATE_API_HOST:-}
      EXDATE_STATUS_HOST: ${EXDATE_STATUS_HOST:-}
    # The names are checked here rather than with compose's `${VAR:?}`, which
    # interpolates the whole file whatever profile is active and would therefore
    # refuse a plain local `docker compose up` for want of a public hostname.
    # An empty name would otherwise reach Caddy as an empty site block and fail
    # with a parse error that says nothing about the cause.
    command:
      - sh
      - -c
      - |
        for v in EXDATE_API_HOST EXDATE_STATUS_HOST; do
          eval "value=\$$v"
          [ -n "$$value" ] || { echo "caddy: $$v is not set. The public profile serves real names over TLS; put both in .env, pointing at this machine." >&2; exit 1; }
        done
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  pgdata:
  subscriptions:
  caddy_data:
  caddy_config:
